id: t2.new_shamir_tqbf
version: 0.1.0
tier: 2
title: new Shamir-Style TQBF Interactive Proof

plugin:
  entrypoint: aipbench.tasks.new_shamir_tqbf:create_task

protocol:
  api_version: aip/1
  mode: interactive
  public_coin: true
  one_shot_eval: true
  max_events: 991
  participant_feedback:
    dev: verbose
    eval: minimal

randomness:
  model: committed_prg
  reveal_on_terminal: true
  domain_separation: required

instance:
  public_schema: schemas/public_instance.schema.json
  private_schema: schemas/private_instance.schema.json

resources:
  wall_time_seconds: 600
  cpu_cores: 4
  memory_mb: 4096
  disk_mb: 4096
  max_artifact_bytes: 33554432
  max_events: 991

audit:
  replay_mode: strict
  require_signature: true
  require_seed_commitment: true
  require_instance_digest: true
  require_event_chain: true
  require_seed_reveal: true

scoring:
  primary: binary_accept
  partial_progress: completed_protocol_fraction

soundness:
  class: public_coin_interactive
  statement: false initial claim acceptance is bounded by the sum of public round degrees divided by 2^61-1
  error_bound: at most 2^-24 for accepted generated instances
