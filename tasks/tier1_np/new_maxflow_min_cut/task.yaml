id: t1.new_maxflow_min_cut
version: 0.1.0
tier: 1
title: New Max-Flow / Min-Cut Certificates

plugin:
  entrypoint: aipbench.tasks.new_maxflow:create_task

protocol:
  api_version: aip/1
  mode: one_shot
  public_coin: false
  one_shot_eval: true
  max_events: 1
  participant_feedback:
    dev: verbose
    eval: minimal

randomness:
  model: committed_prg
  reveal_on_terminal: true
  domain_separation: required

instance:
  public_schema: schemas/public_instance.schema.json
  private_schema: schemas/private_instance.schema.json

resources:
  wall_time_seconds: 600
  cpu_cores: 2
  memory_mb: 512
  disk_mb: 512
  max_artifact_bytes: 8388608
  max_events: 1

audit:
  replay_mode: strict
  require_signature: true
  require_seed_commitment: true
  require_instance_digest: true
  require_event_chain: true
  require_seed_reveal: true

scoring:
  primary: binary_accept
  partial_progress: certificate_submitted

soundness:
  class: deterministic_certificate
  statement: exact primal feasibility plus equal-capacity dual cut
