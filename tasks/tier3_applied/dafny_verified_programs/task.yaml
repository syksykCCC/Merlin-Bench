id: t3.dafny_verified_programs
version: 0.2.0
tier: 3
title: Dafny-Verified Programs

plugin:
  entrypoint: aipbench.tasks.dafny_verified_programs:create_task

protocol:
  api_version: aip/1
  mode: one_shot
  public_coin: false
  one_shot_eval: true
  max_events: 1
  participant_feedback:
    dev: verbose
    eval: minimal

randomness:
  model: none
  reveal_on_terminal: false
  domain_separation: not_applicable

instance:
  public_schema: schemas/public_instance.schema.json
  private_schema: schemas/private_instance.schema.json

resources:
  wall_time_seconds: 600
  cpu_cores: 2
  memory_mb: 2048
  disk_mb: 1024
  max_artifact_bytes: 1048576
  max_events: 1

audit:
  replay_mode: strict
  require_signature: true
  require_seed_commitment: false
  require_instance_digest: true
  require_event_chain: true
  require_seed_reveal: false

scoring:
  primary: binary_accept
  partial_progress: program_submitted

soundness:
  class: native_contract_verified_program
  statement: >-
    Dafny 4.11.0 and its bundled Z3 verify the submitted implementation against
    the public contracts; Arthur then executes its fixed Java harness
