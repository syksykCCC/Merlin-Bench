[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merlin-bench"
version = "0.1.0"
description = "Merlin-Bench interactive-proof benchmark runtime"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Merlin-Bench contributors"}]
dependencies = [
  "cryptography>=42.0",
  "fastapi>=0.111",
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  # Ruff formatting can change across releases (including Markdown code-fence
  # formatting), so CI and local release checks must use the same version.
  "ruff==0.15.21",
  "types-PyYAML>=6.0",
]

[project.scripts]
merlin-bench = "aipbench.cli.main:app"
aipbench = "aipbench.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aipbench = ["py.typed", "transport/http/observer.html"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # Long prose/templates are intentionally wrapped by their target formats.

[tool.ruff.lint.per-file-ignores]
"src/aipbench/cli/main.py" = ["B008"] # Typer's documented declaration style.

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aipbench"]

# Combinatorial generator modules are covered by task and oracle tests.
[[tool.mypy.overrides]]
module = [
  "aipbench.tasks.shared.boolean_hypercube_sumcheck_cases.common",
  "aipbench.tasks.machine_checked_mathematics_cases.c03",
  "aipbench.tasks.machine_checked_mathematics_cases.c04",
  "aipbench.tasks.machine_checked_mathematics_cases.c05",
  "aipbench.tasks.new_boolean_hypercube_sumcheck_cases.common",
  "aipbench.tasks.new_closest_vector_cases.c03",
  "aipbench.tasks.new_closest_vector_cases.c06",
  "aipbench.tasks.new_closest_vector_cases.common",
  "aipbench.tasks.new_graph_non_isomorphism_cases.common",
  "aipbench.tasks.new_homomorphism_cases.*",
  "aipbench.tasks.new_list_graph_homomorphism",
  "aipbench.tasks.new_maxflow_cases.common",
  "aipbench.tasks.new_maxsat_cases.*",
  "aipbench.tasks.new_rooted_group_steiner_tree",
  "aipbench.tasks.new_set_cover_cases.*",
  "aipbench.tasks.new_structured_closest_vector",
  "aipbench.tasks.new_structured_set_cover",
]
ignore_errors = true
